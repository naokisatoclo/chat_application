<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>
<h2>ログイン画面</h2>s

<form th:action="@{/login}" method="post">
    <div>
        <label>メールアドレス：</label>
        <input type="text" name="mailAddress" required />
    </div>
    <div>
        <label>パスワード：</label>
        <input type="password" name="password" required />
    </div>
    <button type="submit">ログイン</button>
</form>
</body>
</html>
